name: ACLClouds Auto

# 续期 + 保活合并为一个工作流，两个 job 按触发来源分流：
# - schedule：github.event.schedule 区分是哪条 cron 触发，只跑对应的 job
# - workflow_dispatch：inputs.task 选择跑哪个（all / renew / power）
on:
  schedule:
    - cron: '28 0 */2 * *'   # 续期：每两天 08:28 CST（UTC 00:28），与备用同一天
    # 续期备用：同一天 14:28 CST 补跑（当天已成功则自动跳过）
    - cron: '28 6 */2 * *'
    # 保活：每天 02:00 / 14:00 UTC（北京时间 10:00 / 22:00）
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '运行哪个任务'
        required: false
        default: 'all'
        type: choice
        options: [all, renew, power]
      dry_run:
        description: 'Dry run（renew：只校验不真正续期；power：只检查不真正开机）'
        required: false
        default: false
        type: boolean
      retried:
        description: '内部用：开机接口 5xx 后自动重跑（先等 5 分钟，不再重跑）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-auto
  cancel-in-progress: false

jobs:
  guard:
    # 定时触发时：今天（北京时间）已有成功运行就跳过，避免主/备用定时重复执行；手动触发总是执行
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.chk.outputs.run }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: renew
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ] || { [ "$SCHED" != "28 0 */2 * *" ] && [ "$SCHED" != "28 6 */2 * *" ]; }; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Asia/Shanghai date +%F)
          since=$(date -u -d "@$(TZ=Asia/Shanghai date -d "$today 00:00" +%s)" +%FT%TZ)
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?status=completed&created=%3E%3D$since&per_page=50" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" || true)
          for id in $ids; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                 --jq ".jobs[] | select(.name == \"$JOB\" and .conclusion == \"success\") | .id" | grep -q .; then
              echo "⏭️ 今天（$today CST）已有成功运行 $id，本次定时跳过"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "▶️ 今天还没有成功运行，继续执行"
          echo "run=true" >> "$GITHUB_OUTPUT"

  renew:
    needs: guard
    if: >
      needs.guard.outputs.run == 'true' && (
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'renew')) ||
      (github.event_name == 'schedule' && (github.event.schedule == '28 0 */2 * *' || github.event.schedule == '28 6 */2 * *'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 加载共享变量（env-config）
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env

      - name: 启动代理（Node_Proxy）
        id: nodeproxy
        continue-on-error: true
        uses: gxjxzhoo/Node_Proxy@v1
        with:
          node-link: ${{ env.NODE_LINK || secrets.NODE_LINK }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/cache@v6
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # 本地代理用的 sing-box 二进制（参考 hohai；node_proxy.py 优先用 SING_BOX_BIN）
      - name: Restore sing-box cache
        if: env.NODE_PROXY_URL == ''
        uses: actions/cache@v6
        with:
          path: ~/sing-box-bin/sing-box
          key: sing-box-v1.14.1-linux-amd64

      - name: Prepare sing-box
        if: env.NODE_PROXY_URL == ''
        run: |
          mkdir -p ~/sing-box-bin
          if [ ! -x ~/sing-box-bin/sing-box ]; then
            echo "缓存未命中，下载 sing-box v1.14.1 ..."
            curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-linux-amd64.tar.gz" -o /tmp/sb.tgz
            tar -xzf /tmp/sb.tgz -C /tmp
            mv /tmp/sing-box-1.14.1-linux-amd64/sing-box ~/sing-box-bin/sing-box
            chmod +x ~/sing-box-bin/sing-box
            rm -rf /tmp/sb.tgz /tmp/sing-box-1.14.1-linux-amd64
          else
            echo "命中 sing-box 缓存，跳过下载"
          fi
          ~/sing-box-bin/sing-box version

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Renew
        id: run
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # 本地代理（参考 hohai）：为空则直连；代理失败自动回退直连
          NODE_LINK: ${{ env.NODE_LINK || secrets.NODE_LINK }}
          SING_BOX_BIN: ~/sing-box-bin/sing-box
          NODE_PROXY_IP: ${{ steps.nodeproxy.outputs.exit-ip }}
          SING_BOX_SHA256: ${{ env.SING_BOX_SHA256 || secrets.SING_BOX_SHA256 }}
          # 可选：设为 chromium 使用新版 headless（更接近真实浏览器，验证码被拦时试试）
          PW_CHANNEL: ${{ vars.PW_CHANNEL }}
          # 可选：浏览器语言（默认 en-US；站点文案随语言变化，如需 fr-FR 在 Variables 里设 ACL_LOCALE）
          ACL_LOCALE: ${{ vars.ACL_LOCALE }}
        run: node renew.mjs

      # 失败时保留截图（仅 3 天），方便排查验证码/选择器问题；shots 里可能有账号页面，勿把仓库设为公开
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: renew-shots-${{ github.run_id }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3

      # 脚本之前的步骤（装依赖/下载 sing-box 等）失败时脚本没机会发 TG，这里兜底提醒一次
      - name: 脚本前置步骤失败通知
        if: failure() && steps.run.conclusion == 'skipped'
        env:
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ] && exit 0
          curl -sS --max-time 15 --retry 2 -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=❌ ACLClouds 续期 工作流在运行脚本前失败（依赖安装/下载等）：${RUN_URL}" || true

      - name: 保活（刷新工作流启用状态，防 60 天无活动被停用）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" \
            && echo "✅ 已刷新工作流启用状态" || echo "⚠️ 保活失败（不影响主任务）"

      - name: 清理旧运行记录（保留最近 10 条）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' \
            | grep -vx "$GITHUB_RUN_ID" | tail -n +"$KEEP" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && echo "已删除运行 $id"
              done || true

  power:
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'power')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2,14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 等待 5 分钟（503 自动重跑）
        if: ${{ inputs.retried == true }}
        run: echo "上次开机接口 5xx，等待 5 分钟后重试"; sleep 300
      - uses: actions/checkout@v7
      - name: 加载共享变量（env-config）
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env

      - name: 启动代理（Node_Proxy）
        id: nodeproxy
        continue-on-error: true
        uses: gxjxzhoo/Node_Proxy@v1
        with:
          node-link: ${{ env.NODE_LINK || secrets.NODE_LINK }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/cache@v6
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # 本地代理用的 sing-box 二进制（参考 hohai；node_proxy.py 优先用 SING_BOX_BIN）
      - name: Restore sing-box cache
        if: env.NODE_PROXY_URL == ''
        uses: actions/cache@v6
        with:
          path: ~/sing-box-bin/sing-box
          key: sing-box-v1.14.1-linux-amd64

      - name: Prepare sing-box
        if: env.NODE_PROXY_URL == ''
        run: |
          mkdir -p ~/sing-box-bin
          if [ ! -x ~/sing-box-bin/sing-box ]; then
            echo "缓存未命中，下载 sing-box v1.14.1 ..."
            curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-linux-amd64.tar.gz" -o /tmp/sb.tgz
            tar -xzf /tmp/sb.tgz -C /tmp
            mv /tmp/sing-box-1.14.1-linux-amd64/sing-box ~/sing-box-bin/sing-box
            chmod +x ~/sing-box-bin/sing-box
            rm -rf /tmp/sb.tgz /tmp/sing-box-1.14.1-linux-amd64
          else
            echo "命中 sing-box 缓存，跳过下载"
          fi
          ~/sing-box-bin/sing-box version

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Power check
        id: run
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # 本地代理（参考 hohai）：为空则直连；代理失败自动回退直连
          NODE_LINK: ${{ env.NODE_LINK || secrets.NODE_LINK }}
          SING_BOX_BIN: ~/sing-box-bin/sing-box
          NODE_PROXY_IP: ${{ steps.nodeproxy.outputs.exit-ip }}
          SING_BOX_SHA256: ${{ env.SING_BOX_SHA256 || secrets.SING_BOX_SHA256 }}
          # 可选：设为 chromium 使用新版 headless（更接近真实浏览器，验证码被拦时试试）
          PW_CHANNEL: ${{ vars.PW_CHANNEL }}
          # 可选：浏览器语言（默认 en-US；站点文案随语言变化，如需 fr-FR 在 Variables 里设 ACL_LOCALE）
          ACL_LOCALE: ${{ vars.ACL_LOCALE }}
          RETRIED: ${{ inputs.retried == true }}
        run: node power.mjs

      - name: 503 后重跑工作流
        if: ${{ failure() && steps.run.outputs.retry == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/aclclouds.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" -f 'inputs[task]=power' -f 'inputs[retried]=true'
          echo "✅ 已触发重跑（新运行会先等 5 分钟）"

      # 失败时保留截图（仅 3 天），方便排查验证码/选择器问题；shots 里可能有账号页面，勿把仓库设为公开
      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: power-shots-${{ github.run_id }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3

      # 脚本之前的步骤（装依赖/下载 sing-box 等）失败时脚本没机会发 TG，这里兜底提醒一次
      - name: 脚本前置步骤失败通知
        if: failure() && steps.run.conclusion == 'skipped'
        env:
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ] && exit 0
          curl -sS --max-time 15 --retry 2 -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=❌ ACLClouds 保活 工作流在运行脚本前失败（依赖安装/下载等）：${RUN_URL}" || true

      - name: 保活（刷新工作流启用状态，防 60 天无活动被停用）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" \
            && echo "✅ 已刷新工作流启用状态" || echo "⚠️ 保活失败（不影响主任务）"

      - name: 清理旧运行记录（保留最近 10 条）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' \
            | grep -vx "$GITHUB_RUN_ID" | tail -n +"$KEEP" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && echo "已删除运行 $id"
              done || true
